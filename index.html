<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A searchable reader for 66 fictional Revenue Integrity interviews, with original answers, separate analyst verdicts, evidence, and exact prompts."
    />
    <meta name="color-scheme" content="light" />
    <title>Revenue Integrity · Interview atlas</title>
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="data/workbook.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the reader</a>
    <header class="masthead">
      <a
        class="brand"
        href="#agent=0&tab=interview"
        aria-label="Revenue Integrity interview atlas home"
      >
        <svg viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
          <path
            d="M5 5h26v26H5zM13 5v26M5 13h26M21 13v18M13 21h18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <circle cx="21" cy="21" r="3.3" fill="currentColor" />
        </svg>
        <span>Revenue Integrity<small>Interview atlas</small></span>
      </a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="#agent=0&tab=interview" data-view="people">Interviews</a>
        <a href="#view=questions&q=Q01" data-view="questions">Compare</a>
        <a href="#view=scope" data-view="scope">Notes</a>
      </nav>
      <a
        class="download"
        href="data/Revenue_Integrity_Interview_Atlas_Visual.xlsx"
        download
        >Download Excel <span aria-hidden="true">↓</span></a
      >
    </header>
    <div class="workspace">
      <aside class="directory" aria-label="Fictional persona directory">
        <div class="directory-heading">
          <h2>People</h2>
          <span class="mono">66 fictional personas</span>
        </div>
        <label class="search-label" for="person-search"
          >Search people & answers</label
        >
        <div class="search-box">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <circle
              cx="8"
              cy="8"
              r="5.3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="m12 12 5 5"
              stroke="currentColor"
              stroke-width="1.5"
            /></svg
          ><input
            id="person-search"
            type="search"
            placeholder="Name, role, phrase…"
            autocomplete="off"
          />
        </div>
        <details class="filter-disclosure">
          <summary>Filter by firm or role</summary>
          <div class="directory-filters">
            <label
              >Firm<select id="firm-filter" aria-label="Firm">
                <option value="">All firms & external</option>
              </select></label
            >
            <label
              >Role<select id="role-filter" aria-label="Role">
                <option value="">All roles</option>
              </select></label
            >
          </div>
        </details>
        <div class="list-heading">
          <span id="person-count" aria-live="polite">66 people</span
          ><button id="reset-filters" class="text-button" type="button">
            Reset filters
          </button>
        </div>
        <div id="people-list" class="people-list"></div>
      </aside>
      <main id="main" tabindex="-1">
        <div class="loading">Opening the interview archive…</div>
      </main>
    </div>
    <dialog id="source-dialog" aria-labelledby="source-dialog-title">
      <div class="dialog-top">
        <div>
          <span class="eyebrow">Original record</span>
          <h2 id="source-dialog-title"></h2>
        </div>
        <button
          id="close-dialog"
          type="button"
          class="close-button"
          aria-label="Close original record"
        >
          ×
        </button>
      </div>
      <div id="source-dialog-body"></div>
    </dialog>
    <noscript
      ><p class="noscript">
        Enable JavaScript to browse the atlas, or
        <a href="data/Revenue_Integrity_66_Agent_Interviews.xlsx"
          >download the unchanged workbook</a
        >. The complete corpus is also in
        <a href="data/workbook.json">workbook.json</a>.
      </p></noscript
    >
  </body>
</html>
